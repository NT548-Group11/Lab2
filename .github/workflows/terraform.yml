name: 'Terraform CI/CD'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

# Bắt buộc phải có quyền ghi id-token để dùng OIDC
permissions:
  id-token: write
  contents: read

jobs:
  checkov:
    name: "Checkov Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Run Checkov action
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true # Bật soft_fail (cảnh báo nhưng không đánh rớt pipeline)
  terraform:
    name: "Terraform Plan & Apply"
    needs: checkov # Chỉ chạy Terraform khi Checkov không báo lỗi ngắt pipeline
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      # BEST PRACTICE: Xác thực AWS bằng OIDC (Không dùng Access Key dài hạn)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TERRAFORM }} # ARN của IAM Role bạn tạo trên AWS
          aws-region: "us-east-1"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Chỉ thực thi Apply tạo tài nguyên THẬT khi code được merge/push vào nhánh main
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
