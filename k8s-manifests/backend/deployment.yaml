apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-dev
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: hmdat1706/nt548-backend:latest
        ports:
        - containerPort: 4000
        # Đã lược bỏ biến môi trường MONGO_URI
        readinessProbe:
          tcpSocket:
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 15
